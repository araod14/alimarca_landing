<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#113a68">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Multiservicios Alimar C.A.</title>
  <link rel="icon" href="assets/alimar-logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:48px 24px;background:var(--deep);color:#fff}
    .notfound img{width:84px;height:84px;border-radius:50%;object-fit:cover}
    .notfound .code{font-size:11px;font-weight:700;letter-spacing:.19em;color:var(--sky);margin:0}
    .notfound h1{font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-.04em;margin:0}
    .notfound p{font-size:15px;line-height:1.7;color:#cfdae6;max-width:420px;margin:0}
  </style>
</head>
<body>
  <main class="notfound">
    <img src="assets/alimar-logo.jpeg" alt="Logo de Multiservicios Alimar C.A." width="84" height="84">
    <p class="code">ERROR 404</p>
    <h1>No encontramos esta página.</h1>
    <p>Es posible que el enlace esté roto o que la página se haya movido. Vuelve al inicio para seguir explorando nuestros servicios.</p>
    <a class="button button-white" href="/">Volver al inicio <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
